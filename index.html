<script>
const KEY="banguriSchoolFreshV2";
const DB_NAME="BanguriSchoolDB";
const STORE_NAME="appState";
let idb=null;

function initDB(){
  return new Promise(resolve=>{
    if(!window.indexedDB) return resolve(false);
    try {
      const req=indexedDB.open(DB_NAME,1);
      req.onupgradeneeded=e=>{
        const d=e.target.result;
        if(!d.objectStoreNames.contains(STORE_NAME)){
          d.createObjectStore(STORE_NAME);
        }
      };
      req.onsuccess=e=>{
        idb=e.target.result;
        resolve(true);
      };
      req.onerror=()=>resolve(false);
    } catch(err){ resolve(false); }
  });
}

function loadFromIDB(){
  return new Promise(resolve=>{
    if(!idb) return resolve(null);
    try {
      const tx=idb.transaction(STORE_NAME,"readonly");
      const store=tx.objectStore(STORE_NAME);
      const req=store.get("state");
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>resolve(null);
    } catch(err){ resolve(null); }
  });
}

function saveToIDB(data){
  return new Promise(resolve=>{
    if(!idb) return resolve(false);
    try {
      const tx=idb.transaction(STORE_NAME,"readwrite");
      const store=tx.objectStore(STORE_NAME);
      store.put(data,"state");
      tx.oncomplete=()=>resolve(true);
      tx.onerror=()=>resolve(false);
    } catch(err){ resolve(false); }
  });
}

// SHA-256 helper for password hashing
async function hashPassword(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

const save=async()=>{
  try{
    localStorage.setItem(KEY,JSON.stringify(db));
  }catch(e){
    console.warn("LocalStorage quota exceeded, relying on IndexedDB");
  }
  await saveToIDB(db);
};

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

let currentView = "home";
let internalNavCount = 0;

function backButtonHtml(){
  return `<button class="btn secondary no-print" onclick="goBack()" style="margin-bottom:15px;display:inline-flex;align-items:center;gap:6px">← ফিরে যান</button>`;
}

function goBack(){
  if(internalNavCount > 0){
    history.back();
  } else {
    navigateTo("home");
  }
}

function updateActiveNavBtn(view){
  document.querySelectorAll(".navbtn").forEach(btn=>btn.classList.remove("active"));
  const btnMap = {
    "home":"nav-home", "results":"nav-results", "notices":"nav-notices",
    "achievements":"nav-achievements", "gallery":"nav-gallery", "school":"nav-school",
    "teachers":"nav-teachers", "downloads":"nav-downloads", "contact":"nav-contact", "admin":"nav-admin"
  };
  const activeId = btnMap[view];
  if(activeId){
    const el = document.getElementById(activeId);
    if(el) el.classList.add("active");
  }
}

function renderView(view){
  currentView = view;
  updateActiveNavBtn(view);
  if(view === "school") school();
  else if(view === "notices") notices();
  else if(view === "results") results();
  else if(view === "achievements") achievements();
  else if(view === "teachers") teachers();
  else if(view === "gallery") gallery();
  else if(view === "downloads" || view === "ডাউনলোড") downloads();
  else if(view === "contact") contact();
  else if(view === "admin") admin();
  else home();
  window.scrollTo({top:0, behavior:'instant'});
}

function navigateTo(view, options = {}){
  const targetView = view || "home";
  if(!options.isPopState){
    if(targetView !== currentView){
      internalNavCount++;
      const hash = targetView === "home" ? "" : "#" + targetView;
      history.pushState({ view: targetView }, "", location.pathname + location.search + hash);
    }
  }
  renderView(targetView);
}

window.addEventListener("popstate", (e) => {
  const stateView = (e.state && e.state.view) ? e.state.view : (location.hash ? location.hash.substring(1) : "home");
  renderView(stateView);
});

function toggleGroupSelect(clsId, wrapId){
  const c = document.getElementById(clsId)?.value;
  const wrap = document.getElementById(wrapId);
  if(!wrap) return;
  if(c === "৯ম" || c === "১০ম"){
    wrap.style.display = "block";
  } else {
    wrap.style.display = "none";
  }
}

function grade(m){m=+m;return m>=80?"A+":m>=70?"A":m>=60?"A-":m>=50?"B":m>=40?"C":m>=33?"D":"F"}
function point(m){m=+m;return m>=80?5:m>=70?4:m>=60?3.5:m>=50?3:m>=40?2:m>=33?1:0}

function findResult(){
 const r=document.getElementById("roll").value.trim(), e=document.getElementById("exam").value, c=document.getElementById("cls").value, y=document.getElementById("year").value.trim();
 let g="";
 if(c==="৯ম" || c==="১০ম"){
   g=document.getElementById("grp").value;
 }
 if(!r){
   alert("দয়া করে রোল নম্বর প্রবেশ করান।");
   return;
 }
 const x=db.results.find(a=>String(a.roll)==r && a.exam==e && a.className==c && a.year==y && (c!=="৯ম"&&c!=="১০ম" || !a.group || a.group==g));
 if(!x){document.getElementById("result").innerHTML=`<div class="notice danger-notice">এই পরীক্ষার জন্য শ্রেণি: ${esc(c)} ${g?`(${esc(g)})`:''}, শিক্ষাবর্ষ: ${esc(y)}, রোল: ${esc(r)}-এর ফলাফল পাওয়া যায়নি।</div>`;return}
 let rows=Object.entries(x.subjects).map(([s,m])=>`<tr><td>${esc(s)}</td><td>100</td><td>${m}</td><td>${grade(m)}</td><td>${point(m).toFixed(2)}</td></tr>`).join("");
 document.getElementById("result").innerHTML=`<div class="card"><h2 style="text-align:center;color:var(--blue)">BANGURI HIGH SCHOOL</h2>
 <p style="text-align:center;margin-top:-10px">দেবিদ্বার, কুমিল্লা</p>
 <hr style="border:0;border-top:1px solid #ccc;margin:15px 0">
 <h3 style="text-align:center;margin:5px 0">${esc(x.exam)} — ${esc(x.year)}</h3>
 <p style="font-size:15px"><b>শিক্ষার্থীর নাম:</b> ${esc(x.name)}<br><b>শ্রেণি:</b> ${esc(x.className)} ${x.group?`(${esc(x.group)})`:''} &nbsp;|&nbsp; <b>রোল নম্বর:</b> ${esc(x.roll)}</p>
 <div class="tablewrap"><table><tr><th>বিষয়</th><th>পূর্ণমান</th><th>প্রাপ্ত নম্বর</th><th>গ্রেড</th><th>গ্রেড পয়েন্ট</th></tr>${rows}</table></div>
 <p style="margin-top:15px;font-size:16px"><b>মোট নম্বর:</b> ${x.total} &nbsp;|&nbsp; <b>GPA:</b> ${x.gpa} &nbsp;|&nbsp; <b>ফলাফল:</b> <span class="${x.pass?'ok':'fail'}">${x.pass?'PASSED':'FAILED'}</span></p>
 <button class="btn no-print" onclick="window.print()">🖨 Print Marksheet</button></div>`;
}

async function changeAdminPassword(){
  const curPw = document.getElementById("curPw").value;
  const newPw = document.getElementById("newPw").value;
  const confirmPw = document.getElementById("confirmPw").value;

  if(!curPw || !newPw || !confirmPw){
    return alert("সকল ফিল্ড পূরণ করুন।");
  }
  if(!(await checkAdminPass(curPw))){
    return alert("বর্তমান পাসওয়ার্ড সঠিক নয়।");
  }
  if(newPw.length < 6){
    return alert("নতুন পাসওয়ার্ড অন্তত ৬ অক্ষরের হতে হবে।");
  }
  if(newPw !== confirmPw){
    return alert("নতুন পাসওয়ার্ড দুটি মিলছে না।");
  }

  db.adminPassHash = await hashPassword(newPw);
  await save();
  alert("Admin পাসওয়ার্ড সফলভাবে আপডেট করা হয়েছে!");
  admin();
}

function previewImage(input, previewId){
  const file = input.files[0];
  const div = document.getElementById(previewId);
  if(!file || !div) return;
  if(file.size > 5 * 1024 * 1024){
    alert("ছবির সাইজ সর্বোচ্চ 5MB হতে হবে।");
    input.value = "";
    div.innerHTML = "";
    return;
  }
  const rd = new FileReader();
  rd.onload = e => {
    div.innerHTML = `<img src="${e.target.result}" style="max-width:180px;max-height:180px;border-radius:8px;border:1px solid #cbd6e0">`;
  };
  rd.readAsDataURL(file);
}

async function addNotice(){
  if(sessionStorage.getItem("banguriAdmin")!=="yes"){ return alert("অনুমতি প্রয়োজন।"); }
  const t=document.getElementById("nt").value.trim();
  const b=document.getElementById("nb").value.trim();
  if(!t) return alert("নোটিশের শিরোনাম প্রদান করুন।");

  const pdfInput = document.getElementById("npdf");
  const imgInput = document.getElementById("nimg");
  let pdfDataUrl = null;
  let imgDataUrl = null;

  if(pdfInput && pdfInput.files && pdfInput.files[0]){
    const file = pdfInput.files[0];
    if(file.type !== "application/pdf"){
      return alert("সংযুক্তি অবশ্যই একটি PDF ফাইল হতে হবে।");
    }
    if(file.size > 10 * 1024 * 1024){
      return alert("PDF ফাইলের সাইজ সর্বোচ্চ 10MB হতে হবে।");
    }
    pdfDataUrl = await new Promise(resolve => {
      const rd = new FileReader();
      rd.onload = e => resolve(e.target.result);
      rd.readAsDataURL(file);
    });
  }

  if(imgInput && imgInput.files && imgInput.files[0]){
    const file = imgInput.files[0];
    if(!["image/jpeg","image/png","image/webp"].includes(file.type)){
      return alert("ছবি অবশ্যই JPG, PNG বা WebP হতে হবে।");
    }
    if(file.size > 5 * 1024 * 1024){
      return alert("ছবির সাইজ সর্বোচ্চ 5MB হতে হবে।");
    }
    imgDataUrl = await new Promise(resolve => {
      const rd = new FileReader();
      rd.onload = e => resolve(e.target.result);
      rd.readAsDataURL(file);
    });
  }

  db.notices.unshift({
    title: t,
    body: b,
    date: new Date().toLocaleDateString("bn-BD"),
    pdfUrl: pdfDataUrl,
    imageUrl: imgDataUrl
  });
  await save();
  alert("নোটিশ সফলভাবে প্রকাশিত হয়েছে।");
  admin();
}

async function importResults(){
 if(sessionStorage.getItem("banguriAdmin")!=="yes"){
   alert("অনুমতি প্রয়োজন।"); return;
 }
 const f=document.getElementById("file").files[0]; if(!f)return alert("Excel/CSV ফাইল নির্বাচন করুন");
 const exam=document.getElementById("ae").value;
 const cls=document.getElementById("ac").value;
 const year=document.getElementById("ay").value.trim();
 const grp=(cls==="৯ম" || cls==="১০ম") ? document.getElementById("agrp").value : "";
 const msgDiv = document.getElementById("msg");
 msgDiv.innerHTML = "<p class='muted'>ফাইল প্রসেসিং হচ্ছে...</p>";

 const expectedSubjects = (cls==="৯ম" || cls==="১০ম") ? CLASS_SUBJECTS[cls][grp] : CLASS_SUBJECTS[cls];
 if(!expectedSubjects){
   msgDiv.innerHTML = "<p class='fail'>অবৈধ শ্রেণি বা গ্রুপ নির্বাচন করা হয়েছে।</p>";
   return;
 }

 const rd=new FileReader();
 rd.onload=async e=>{
   try{
     let rows=[];
     if(f.name.toLowerCase().endsWith(".csv")){
       const text=e.target.result.replace(/\r/g,"").trim();
       const lines=text.split("\n");
       const head=lines.shift().split(",").map(x=>x.trim().replace(/^"|"$/g,''));
       rows=lines.filter(Boolean).map(line=>{
         const c=line.split(",").map(x=>x.trim().replace(/^"|"$/g,''));
         const o={}; head.forEach((h,i)=>o[h]=(c[i]||"").trim()); return o;
       });
     }else{
       const wb=XLSX.read(e.target.result,{type:"array"});
       let sheetName = wb.SheetNames[0];
       if(cls==="৯ম" || cls==="১০ম"){
         if(wb.SheetNames.includes(grp)){
           sheetName = grp;
         }
       }
       const ws=wb.Sheets[sheetName];
       rows=XLSX.utils.sheet_to_json(ws,{defval:""});
     }

     if(!rows || !rows.length){
       msgDiv.innerHTML = "<p class='fail'>ফাইলটিতে কোনো তথ্য পাওয়া যায়নি।</p>";
       return;
     }

     // Validate headers
     const firstRowKeys = Object.keys(rows[0]).map(k=>k.trim());
     const hasRoll = firstRowKeys.some(k=>/roll/i.test(k) || k==="রোল");
     const hasName = firstRowKeys.some(k=>/name/i.test(k) || k==="নাম" || /student/i.test(k));

     if(!hasRoll || !hasName){
       msgDiv.innerHTML = "<p class='fail'>ফাইলে 'Roll' এবং 'Student Name' কলাম থাকা বাধ্যতামূলক।</p>";
       return;
     }

     // Validate marks and duplicate rolls
     const errors = [];
     const seenRolls = new Set();
     const parsedRecords = [];

     for(let i=0; i<rows.length; i++){
       const o = rows[i];
       const rollKey = Object.keys(o).find(k=>/roll/i.test(k) || k==="রোল");
       const nameKey = Object.keys(o).find(k=>/name/i.test(k) || k==="নাম" || /student/i.test(k));
       const rollVal = String(o[rollKey]||"").trim();
       const nameVal = String(o[nameKey]||"").trim();

       if(!rollVal && !nameVal) continue; // skip blank row

       if(!rollVal){
         errors.push(`সারি ${i+2}: রোল নম্বর অনুপস্থিত।`);
         continue;
       }
       if(!nameVal){
         errors.push(`সারি ${i+2} (রোল ${rollVal}): শিক্ষার্থীর নাম অনুপস্থিত।`);
         continue;
       }
       if(seenRolls.has(rollVal)){
         errors.push(`আপলোডকৃত ফাইলে একই রোল (${rollVal}) একাধিকবার রয়েছে।`);
       } else {
         seenRolls.add(rollVal);
       }

       const studentSubjects = {};
       let allPassed = true;

       for(const subj of expectedSubjects){
         const matchedKey = Object.keys(o).find(k => k.trim() === subj.trim());
         if(matchedKey === undefined || o[matchedKey] === ""){
           errors.push(`রোল ${rollVal}-এর জন্য '${subj}' বিষয়ের নম্বর অনুপস্থিত।`);
           continue;
         }
         const valNum = Number(o[matchedKey]);
         if(isNaN(valNum) || valNum < 0 || valNum > 100){
           errors.push(`রোল ${rollVal}-এর জন্য '${subj}' বিষয়ের নম্বর (${o[matchedKey]}) অবৈধ। নম্বর ০ থেকে ১০০-এর মধ্যে হতে হবে।`);
         } else {
           studentSubjects[subj] = valNum;
           if(valNum < 33) allPassed = false;
         }
       }

       const markVals = Object.values(studentSubjects);
       const total = markVals.reduce((a,b)=>a+b, 0);
       let overallGpa = "0.00";
       if(allPassed && markVals.length === expectedSubjects.length){
         const totalPoints = markVals.reduce((a,b)=>a+point(b), 0);
         overallGpa = (totalPoints / markVals.length).toFixed(2);
       } else {
         allPassed = false;
       }

       parsedRecords.push({
         roll: rollVal,
         name: nameVal,
         exam,
         className: cls,
         group: grp,
         year,
         subjects: studentSubjects,
         total,
         gpa: overallGpa,
         pass: allPassed
       });
     }

     if(errors.length > 0){
       msgDiv.innerHTML = `<div class="notice danger-notice"><b style="color:var(--danger)">ফাইল যাচাইকরণ ত্রুটি (${errors.length}):</b><br><ul style="margin:5px 0 0 20px;padding:0">${errors.map(err=>`<li>${esc(err)}</li>`).join('')}</ul></div>`;
       return;
     }

     // Check existing conflicting records
     const existingCount = db.results.filter(r => r.exam === exam && r.className === cls && r.year === year && (cls!=="৯ম"&&cls!=="১০ম" || r.group===grp) && seenRolls.has(String(r.roll))).length;

     if(existingCount > 0){
       const proceed = confirm(`${cls} ${grp?`(${grp})`:''} - ${exam} (${year})-এর ${existingCount} টি শিক্ষার্থীর ফলাফল পূর্বে সংরক্ষিত রয়েছে। আপনি কি এগুলো আপডেট/ওভাররাইট করতে চান?`);
       if(!proceed){
         msgDiv.innerHTML = "<p class='muted'>ইম্পোর্ট বাতিল করা হয়েছে।</p>";
         return;
       }
     }

     for(const rec of parsedRecords){
       const idx = db.results.findIndex(r => r.exam === rec.exam && r.className === rec.className && r.year === rec.year && (cls!=="৯ম"&&cls!=="১০ম" || r.group===rec.group) && String(r.roll) === String(rec.roll));
       if(idx >= 0){
         db.results[idx] = rec;
       } else {
         db.results.push(rec);
       }
     }

     await save();
     msgDiv.innerHTML = `<p class="ok">সফলভাবে ${parsedRecords.length} জন শিক্ষার্থীর ফলাফল ইম্পোর্ট ও সংরক্ষণ করা হয়েছে!</p>`;
     setTimeout(()=>admin(), 1200);
   } catch(err){
     msgDiv.innerHTML = `<p class="fail">ফাইল প্রসেস করতে সমস্যা হয়েছে: ${esc(err.message)}</p>`;
   }
 };

 if(f.name.toLowerCase().endsWith(".csv")){
   rd.readAsText(f);
 } else {
   rd.readAsArrayBuffer(f);
 }
}
